name: publish-report

# Manual only: nothing is published until you run this workflow yourself.
# Before the first run: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the aggregated results in results/ go into the page. Links point to this repository on GitHub.
      - run: python scripts/build_report.py --repo-url "https://github.com/${{ github.repository }}" --out site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
