  - id: deep_learning_nlp
    label: Deep learning / NLP
    group: statistics_ml
    patterns: ['\bdeep\s*learning\b', '\bneural\s*net', '\bhọc\s*sâu\b', '\bnlp\b', '\bnatural\s*language\b', '\btensorflow\b', '\bpytorch\b', '\bkeras\b', '\bcomputer\s*vision\b']

  # ------------------------------------------------------------------- ai_genai
  - id: generative_ai
    label: Generative AI / LLM tools
    group: ai_genai
    patterns: ['\bchat\s*-?\s*gpt\b', '\bgenerative\s*ai\b', '\bgen\s*-?\s*ai\b', '\bllms?\b', '\blarge\s*language\s*models?\b', '\bprompt\s*(?:engineering|design)\b', '\bcopilot\b', '\bopenai\b', '\bclaude\b', '\bgemini\b', '\bai\s*agents?\b', '\bagentic\b', '\bai\s*assistants?\b', '\bai\s*tools?\b', '\bcông\s*cụ\s*ai\b', '\bai\s*tạo\s*sinh\b', '\brag\b', '\bvector\s*(?:db|database|store)\b']
    patterns_cs: ['\bGPT-?\d', '\bLLM']
  - id: ai_general
    label: AI (any mention)
    group: ai_genai
    patterns: ['\bartificial\s*intelligence\b', '\btrí\s*tuệ\s*nhân\s*tạo\b', '\bai/ml\b', '\bai\s*(?:&|and|và)\s*ml\b']
    patterns_cs: ['\bAI\b', '\bA\.I\.']
  - id: automation
    label: Automation
    group: ai_genai
    patterns: ['\bautomat', '\btự\s*động\s*h[óo]a?\b']
  - id: rpa_low_code
