    group: analytics_methods
    patterns: ['\broot\s*cause', '\bdiagnos', '\bnguyên\s*nhân\b', '\bdeep[- ]dive', '\bvariance\s*analysis\b']
  - id: data_mining
    label: Data mining
    group: analytics_methods
    patterns: ['\bdata\s*mining\b', '\bkhai\s*(?:phá|thác)\s*dữ\s*liệu\b']
  - id: data_cleaning
    label: Data cleaning and preparation
    group: analytics_methods
    patterns: ['\bdata\s*(?:cleaning|cleansing|wrangling|preparation|prep)\b', '\bclean\s*(?:and\s*)?(?:transform|prepare)', '\blàm\s*sạch\s*dữ\s*liệu\b', '\bxử\s*lý\s*dữ\s*liệu\b']
  - id: financial_analysis
