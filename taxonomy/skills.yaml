    group: data_engineering
    patterns: ['\bscrap(?:e|ing|er)\b', '\bcrawl']
  - id: data_modeling
    label: Data modelling
    group: data_engineering
    patterns: ['\bdata\s*model', '\bmô\s*hình\s*(?:hóa\s*)?dữ\s*liệu\b', '\bstar\s*schema\b', '\bdimensional\s*model', '\bfact\s*(?:and|/|&)\s*dimension']

  # ---------------------------------------------------------------------- cloud
  - id: aws
    label: AWS
    group: cloud
    patterns: ['\baws\b', '\bamazon\s*web\s*services\b', '\bs3\b', '\bathena\b']
  - id: azure
    label: Microsoft Azure
    group: cloud
    patterns: ['\bazure\b', '\bsynapse\b', '\bmicrosoft\s*fabric\b', '\bfabric\s*(?:lakehouse|warehouse|notebook)']
  - id: gcp
    label: Google Cloud
    group: cloud
    patterns: ['\bgcp\b', '\bgoogle\s*cloud\b']
  - id: cloud_generic
    label: Cloud (the term)
    group: cloud
    patterns: ['\bcloud\b', '\bđám\s*mây\b']

  # -------------------------------------------------------------- statistics_ml
  - id: statistics
    label: Statistics
    group: statistics_ml
    patterns: ['\bstatistic', '\bthống\s*kê\b', '\bhypothesis\b', '\bregression\b', '\bhồi\s*quy\b', '\bprobabilit']
  - id: ab_testing
    label: A/B testing and experimentation
    group: statistics_ml
    patterns: ['\ba/b\s*test', '\bab\s*test', '\bsplit\s*test', '\bexperiment', '\bthử\s*nghiệm\b']
  - id: machine_learning
    label: Machine learning
    group: statistics_ml
    patterns: ['\bmachine\s*learning\b', '\bhọc\s*máy\b', '\bscikit[- ]?learn\b', '\bsklearn\b', '\bxgboost\b', '\brandom\s*forest\b', '\bclassification\b', '\bclustering\b']
    patterns_cs: ['\bML\b']
  - id: predictive_modeling
