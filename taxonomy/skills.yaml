# Skill and tool taxonomy for the Data Analyst job-shift study.
#
# This is a DATA FILE, versioned on purpose. Every result table names the
# taxonomy version it was produced with, so a later edit (a new tool, a fixed
# pattern) never silently changes an old number.
#
# How matching works (extract_deterministic.py):
#   * text is Unicode-NFC normalised first (Vietnamese letters stored in
#     decomposed form would otherwise break word boundaries: "bị" looks like
#     "bi" + a mark, and "BI" would match it);
#   * `patterns` are Python regexes matched case-INsensitively;
#   * `patterns_cs` are matched case-SENSITIVELY, for short tokens where case
#     carries meaning (R, SAS vs SaaS, AI vs the Vietnamese word "ai" = who,
#     BI vs "bi"/"bị", DAX, SAP, ETL vs "etl" is fine either way);
#   * a document counts as mentioning a skill when ANY pattern hits at least
#     once. We count documents, not mentions, so a long posting that repeats
#     "SQL" ten times weighs the same as a short one that says it once.
#
# Vietnamese aliases are included where the Vietnamese market writes the term
# in Vietnamese ("phân tích dữ liệu", "tiếng Anh", "kho dữ liệu"). Tool names
# are almost always written in English in Vietnamese postings.
#
# Groups are for reading the results, not for matching.

version: "1.0.0"
updated: "2026-10-04"

groups:
  programming:        Programming and query languages
  bi_visualization:   BI and visualisation tools
  spreadsheets:       Spreadsheets and office tools
  databases:          Databases and warehouses
  data_engineering:   Data engineering and pipelines
  cloud:              Cloud platforms
  statistics_ml:      Statistics and machine learning
  ai_genai:           AI and generative AI
  analytics_methods:  Analysis methods and deliverables
  business_tools:     Business systems and product analytics
  data_management:    Data management and governance
  soft_skills:        Soft skills
  language:           Human languages
  ways_of_working:    Ways of working

skills:
  # ---------------------------------------------------------------- programming
  - id: sql
    label: SQL
    group: programming
    patterns: ['\bsql\b', '\bmysql\b', '\bt-sql\b', '\bpl/?sql\b', '\bmssql\b', '\bpostgres(ql)?\b', '\bsql\s*server\b', '\btruy\s*vấn\b']
  - id: python
    label: Python
    group: programming
    patterns: ['\bpython\b', '\bpandas\b', '\bnumpy\b', '\bjupyter\b']
  - id: r_lang
    label: R
    group: programming
    # Bare "R" is only accepted next to list punctuation or a telling word:
    # "SQL/R/Python", "R, Python", "R programming", "R Studio".
    patterns_cs: ['(?<![A-Za-z0-9])R(?=\s*(?:[,/;)]|\bprogramming\b|\blanguage\b|\bstudio\b|\bscripts?\b|\bor\s|\band\s))', '(?<=[/(,])\s?R(?![A-Za-z0-9&])', '\bRStudio\b', '\bR-studio\b']
    patterns: ['\btidyverse\b', '\bggplot2?\b', '\bdplyr\b', '\bshiny\b']
  - id: vba_macros
    label: VBA / macros
    group: programming
    patterns: ['\bvba\b', '\bmacros?\b']
  - id: dax
    label: DAX
    group: programming
    patterns_cs: ['\bDAX\b']
  - id: power_query
    label: Power Query
    group: programming
    patterns: ['\bpower\s*query\b']
  - id: scala_java
    label: Scala / Java
    group: programming
    patterns: ['\bscala\b', '\bjava\b(?!script)']
  - id: sas
    label: SAS
    group: programming
    patterns_cs: ['\bSAS\b']
  - id: spss_stata
    label: SPSS / Stata
    group: programming
    patterns: ['\bspss\b', '\bstata\b', '\bminitab\b', '\beviews\b']

  # ------------------------------------------------------------ bi_visualization
  - id: power_bi
    label: Power BI
    group: bi_visualization
    patterns: ['\bpower\s*-?\s*bi\b', '\bpowerbi\b']
  - id: tableau
    label: Tableau
    group: bi_visualization
    patterns: ['\btableau\b']
  - id: looker
    label: Looker / LookML
    group: bi_visualization
    patterns: ['\blooker\b(?!\s*studio)', '\blookml\b']
  - id: looker_studio
    label: Looker Studio / Data Studio
    group: bi_visualization
    patterns: ['\blooker\s*studio\b', '\bgoogle\s*data\s*studio\b', '\bdata\s*studio\b']
  - id: qlik
    label: Qlik
    group: bi_visualization
    patterns: ['\bqlik(view|sense)?\b']
  - id: other_bi_tools
    label: Other BI tools (Metabase, Superset, Redash, MicroStrategy, Cognos, SAP BO)
    group: bi_visualization
    patterns: ['\bmetabase\b', '\bsuperset\b', '\bredash\b', '\bmicrostrategy\b', '\bcognos\b', '\bbusiness\s*objects\b', '\bsisense\b', '\bdomo\b', '\bgrafana\b']
  - id: bi_generic
    label: Business intelligence (the term)
    group: bi_visualization
    patterns: ['\bbusiness\s*intelligence\b']
    patterns_cs: ['\bBI\b(?!\s*(?:đà|đa|đổ))']
  - id: data_visualization
    label: Data visualisation
    group: bi_visualization
    patterns: ['\bvisuali[sz]', '\btrực\s*quan\s*h[óo]a?\b', '\bbiểu\s*đồ\b', '\bcharts?\b']
  - id: dashboard
    label: Dashboards
    group: bi_visualization
    patterns: ['\bdashboards?\b']

  # ---------------------------------------------------------------- spreadsheets
  - id: excel
    label: Excel
    group: spreadsheets
    patterns: ['\b(?:ms\s*|microsoft\s*)?excel\b(?!\s+(?:at|in)\b)', '\bpivot\s*tables?\b', '\bvlookup\b', '\bxlookup\b']
  - id: google_sheets
    label: Google Sheets / spreadsheets
    group: spreadsheets
    patterns: ['\bgoogle\s*sheets?\b', '\bspreadsheets?\b', '\bbảng\s*tính\b']
  - id: powerpoint
    label: PowerPoint
    group: spreadsheets
    patterns: ['\bpower\s*point\b', '\bppt\b', '\bslides?\b']

