    patterns: ['\bmixpanel\b', '\bamplitude\b', '\bfirebase\b', '\bappsflyer\b', '\bbraze\b', '\bclevertap\b', '\bsegment\.io\b']
  - id: ads_platforms
    label: Ads platforms (Google Ads, Meta Ads, TikTok Ads)
    group: business_tools
    patterns: ['\bgoogle\s*ads\b', '\bfacebook\s*ads\b', '\bmeta\s*ads\b', '\btiktok\s*ads\b', '\bads\s*manager\b', '\bperformance\s*marketing\b']
  - id: ecommerce_platforms
    label: E-commerce platforms (Shopee, Lazada, Tiki, Shopify)
    group: business_tools
    patterns: ['\bshopee\b', '\blazada\b', '\btiki\b', '\bshopify\b', '\be-?commerce\b', '\bthương\s*mại\s*điện\s*tử\b']
  - id: jira_confluence
    label: Jira
    group: business_tools
    patterns: ['\bjira\b', '\btrello\b', '\basana\b']
    patterns_cs: ['\bNotion\b']

