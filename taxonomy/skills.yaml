    group: analytics_methods
    patterns: ['\bfinancial\s*(?:analysis|model)', '\bp&l\b', '\bbudget', '\bphân\s*tích\s*tài\s*chính\b', '\bpricing\b', '\brevenue\b', '\bdoanh\s*thu\b']
  - id: market_customer_analysis
