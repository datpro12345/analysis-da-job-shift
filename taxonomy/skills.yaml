    group: data_management
    patterns: ['\bdata\s*governance\b', '\bquản\s*trị\s*dữ\s*liệu\b', '\bdata\s*steward', '\bdata\s*catalog', '\bmaster\s*data\b', '\bmetadata\b', '\bdata\s*lineage\b', '\bdata\s*owner']
  - id: data_privacy_security
    label: Data privacy, security and compliance
    group: data_management
    patterns: ['\bdata\s*privacy\b', '\bgdpr\b', '\bpdpa\b', '\bnghị\s*định\s*13\b', '\bdata\s*(?:security|protection)\b', '\bbảo\s*mật\s*(?:dữ\s*liệu|thông\s*tin)\b', '\bcompliance\b', '\btuân\s*thủ\b']
  - id: documentation
