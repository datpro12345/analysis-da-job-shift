    group: analytics_methods
    patterns: ['\binsights?\b', '\brecommendations?\b', '\bđề\s*xuất\b']
  - id: storytelling
    label: Data storytelling
    group: analytics_methods
    patterns: ['\bstory\s*-?\s*telling\b', '\bkể\s*chuyện\b', '\bnarrative\b']
  - id: segmentation_cohort_funnel
    label: Segmentation, cohort and funnel analysis
    group: analytics_methods
    patterns: ['\bsegmentation\b', '\bphân\s*khúc\b', '\bcohorts?\b', '\bfunnels?\b', '\bchurn\b', '\bretention\b', '\bltv\b', '\blifetime\s*value\b', '\brfm\b']
  - id: root_cause
