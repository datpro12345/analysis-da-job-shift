    patterns: ['\bdata\s*warehous', '\bdwh?\b', '\bkho\s*dữ\s*liệu\b', '\bdata\s*mart\b', '\bdata\s*lake(house)?\b']
  - id: bigquery
    label: BigQuery
    group: databases
    patterns: ['\bbig\s*query\b']
  - id: snowflake
    label: Snowflake
    group: databases
    patterns: ['\bsnowflake\b']
  - id: redshift
    label: Amazon Redshift
    group: databases
    patterns: ['\bredshift\b']
  - id: databricks
    label: Databricks
    group: databases
    patterns: ['\bdatabricks\b']
  - id: oracle
    label: Oracle
    group: databases
    patterns: ['\boracle\b']
  - id: sql_server
    label: Microsoft SQL Server
    group: databases
    patterns: ['\bsql\s*server\b', '\bmssql\b', '\bssis\b', '\bssrs\b', '\bssas\b']
  - id: mysql_postgres
    label: MySQL / PostgreSQL
    group: databases
    patterns: ['\bmysql\b', '\bpostgres(ql)?\b', '\bmariadb\b']
  - id: nosql
    label: NoSQL (MongoDB, Cassandra, Elasticsearch)
    group: databases
    patterns: ['\bnosql\b', '\bmongo\s*db\b', '\bmongodb\b', '\bcassandra\b', '\belasticsearch\b', '\bdynamodb\b']
  - id: big_data_stack
    label: Big data stack (Hadoop, Hive, Spark, Kafka)
    group: databases
    patterns: ['\bhadoop\b', '\bhive\b', '\b(?:py)?spark\b', '\bkafka\b', '\bbig\s*data\b', '\bdữ\s*liệu\s*lớn\b', '\bclickhouse\b', '\bteradata\b']

  # ----------------------------------------------------------- data_engineering
  - id: etl
    label: ETL / ELT
    group: data_engineering
    patterns: ['\betl\b', '\belt\b', '\bextract,?\s*transform', '\bdata\s*integration\b']
  - id: data_pipeline
    label: Data pipelines
    group: data_engineering
    patterns: ['\b(?:data|etl|elt|ingestion|analytics|reporting)\s*pipelines?\b', '\bpipelines?\s*(?:for|of)\s*data\b']
  - id: airflow_orchestration
    label: Airflow / orchestration
    group: data_engineering
    patterns: ['\bairflow\b', '\bdagster\b', '\bprefect\b', '\borchestrat']
  - id: dbt
