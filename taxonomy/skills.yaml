    group: data_engineering
    patterns: ['\bgit(hub|lab)?\b', '\bversion\s*control\b', '\bbitbucket\b']
  - id: api_integration
    label: APIs
    group: data_engineering
    patterns: ['\bapis?\b', '\brestful\b', '\brest\s*apis?\b', '\bwebhooks?\b']
  - id: web_scraping
