    patterns: ['\bdocument(?:ation|ing|ed)?\b', '\bdata\s*dictionar', '\btài\s*liệu\s*h[óo]a\b']
  - id: self_service_analytics
    label: Self-service analytics / data literacy
    group: data_management
    patterns: ['\bself[- ]service\b', '\bdata\s*literacy\b', '\bdata[- ]driven\s*culture\b', '\benablement\b']

  # ---------------------------------------------------------------- soft_skills
  - id: communication
    label: Communication
    group: soft_skills
    patterns: ['\bcommunicat', '\bgiao\s*tiếp\b']
  - id: presentation
    label: Presentation skills
    group: soft_skills
    patterns: ['\bpresent(?:ation|ing)\b', '\bthuyết\s*trình\b', '\btrình\s*bày\b']
  - id: stakeholder_management
    label: Stakeholder management
    group: soft_skills
    patterns: ['\bstakeholders?\b', '\bcross[- ]functional\b', '\bbusiness\s*partner', '\bcác\s*phòng\s*ban\b', '\bliên\s*phòng\b']
  - id: problem_solving
