    group: business_tools
    patterns: ['\bcrm\b', '\bsalesforce\b', '\bsfdc\b', '\bhubspot\b', '\bzoho\b', '\bdynamics\s*365\b']
  - id: google_analytics
    label: Google Analytics / GA4 / Tag Manager
    group: business_tools
    patterns: ['\bgoogle\s*analytics\b', '\bga4\b', '\bgoogle\s*tag\s*manager\b', '\bgtm\b']
  - id: product_analytics_tools
    label: Product analytics tools (Mixpanel, Amplitude, Firebase, AppsFlyer)
